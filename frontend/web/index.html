<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="پیام‌رسانی با هویت تأییدشده، خدمات دانشگاهی و کانال‌های آموزشی.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="پیام‌رسان دانشگاه">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>پیام‌رسان دانشگاه</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter mirrors its own layout and positions web overlays from the left. */
    body { direction: ltr; }
  </style>
  <script src="vendor/sqljs/sql-wasm.js"></script>
  <script>
    // Keep Drift's loader and matching SQLite binary on the app's own origin.
    const loadSqlJs = window.initSqlJs;
    window.initSqlJs = (options = {}) => loadSqlJs({
      ...options,
      locateFile: (file) =>
        new URL(`vendor/sqljs/${file}`, document.baseURI).href,
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
