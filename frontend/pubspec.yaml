name: university_messenger
description: University-verified messaging for students, professors, and staff.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  drift: 2.31.0
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^10.3.4
  file_selector: ^1.0.4
  go_router: ^17.5.0
  intl: ^0.20.2
  livekit_client: 2.5.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  video_player: ^2.11.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  drift_dev: 2.31.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
