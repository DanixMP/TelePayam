[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "university-messenger-backend"
version = "0.1.0"
description = "University messenger backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=23.1,<24",
  "cryptography>=47,<49",
  "pyotp>=2.9,<3",
  "redis>=5.2,<6",
  "arq>=0.26,<1",
  "python-multipart>=0.0.18,<1",
  "aiofiles>=24.1,<25",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
