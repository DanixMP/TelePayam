services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    environment: &backend-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://messenger:messenger@postgres:5432/messenger
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: development-only-jwt-secret-change-me
      DATA_HMAC_KEY: development-only-hmac-key-change-me
      MEDIA_ROOT: /app/var/media
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *backend-env
    volumes:
      - media_data:/app/var/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: arq app.workers.settings.WorkerSettings
    environment: *backend-env
    volumes:
      - media_data:/app/var/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
